<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absensi DPMPTSP - Morowali</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e40af">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Absensi DPMPTSP">
    <link rel="apple-touch-icon" href="assets/img/morowali.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { touch-action: manipulation; background-color: #f0f9ff; }
        .loader { border-top-color: #2563eb; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="font-sans antialiased text-gray-800 min-h-screen flex items-center justify-center bg-blue-50">

    <div class="bg-white w-full max-w-md min-h-screen shadow-2xl relative flex flex-col mx-auto overflow-hidden border-x border-gray-100">
        
        <div class="bg-blue-800 pt-10 pb-20 px-6 rounded-b-[2rem] relative z-0 shadow-md">
            <div class="flex items-center gap-4 mb-2">
                <div class="bg-white p-1.5 rounded-full shadow-md shrink-0">
                    <img src="assets/img/morowali.png" alt="Logo Pemda Morowali" id="logoPemda" onclick="resetDevice()" class="w-10 h-10 object-contain cursor-pointer">
                </div>
                <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<div>
    <h1 class="text-white text-lg font-bold tracking-widest leading-none italic" style="font-family: 'ui-sans-serif', system-ui;">
        ABSENSI <span class="text-amber-400 not-italic">DPMPTSP</span>
    </h1>
    <div class="h-0.5 w-12 bg-amber-400 mt-1 rounded-full"></div> </div>
            </div>
        </div>

        <div class="relative z-10 mx-5 -mt-14 bg-white rounded-2xl shadow-lg border border-blue-50 p-6 text-center">
            <h2 id="clock" class="text-5xl font-light text-blue-900 tracking-tight font-mono">00:00:00</h2>
            <div class="flex items-center justify-center gap-1.5 mt-1 mb-3">
                <p class="text-blue-600 text-xs font-bold uppercase tracking-wider">Waktu Indonesia Tengah</p>
                <span class="flex h-2 w-2 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-600"></span>
                </span>
            </div>
            <div class="w-full h-px bg-blue-50 my-3"></div>
            <p id="date" class="text-gray-500 font-semibold text-sm">Memuat tanggal...</p>
        </div>

        <div class="flex-grow px-5 pt-6 pb-8 flex flex-col gap-5">
            
            <div>
                <h3 class="text-xs font-bold text-blue-800/60 uppercase tracking-wider mb-2 ml-1">Status Lokasi (GPS)</h3>
                <div class="bg-white border border-blue-100 rounded-xl p-4 flex items-center gap-3 shadow-sm">
                    <div id="ikonGps" class="bg-blue-50 p-2.5 rounded-full text-blue-600">
                        <svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </div>
                    <div>
                        <p id="teksLokasiUtama" class="text-gray-800 font-bold text-sm">Mencari Koordinat...</p>
                        <p id="teksLokasiDetail" class="text-gray-500 text-xs mt-0.5">Memerlukan akses lokasi perangkat.</p>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="text-xs font-bold text-blue-800/60 uppercase tracking-wider mb-2 ml-1">Identitas Pegawai</h3>
                <div id="areaIdentitas" class="relative">
                    <div class="flex justify-center py-4"><div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-8 w-8"></div></div>
                </div>
            </div>

            <div class="mt-auto flex flex-col gap-3 pt-4">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="klikAbsen('Datang')" id="btnDatang" disabled class="bg-gray-300 text-gray-500 font-semibold py-4 rounded-xl flex flex-col items-center justify-center gap-2">
                        <span class="text-sm">⏳ Memuat...</span>
                    </button>
                    
                    <button onclick="klikAbsen('Pulang')" id="btnPulang" disabled class="bg-gray-300 text-gray-500 font-semibold py-4 rounded-xl flex flex-col items-center justify-center gap-2">
                        <span class="text-sm">⏳ Memuat...</span>
                    </button>
                </div>
                
                <button onclick="klikAbsen('Tugas Luar')" id="btnTL" disabled class="w-full bg-gray-100 text-gray-400 border border-gray-200 font-semibold py-3.5 rounded-xl transition flex items-center justify-center gap-2 mt-1">
                    <span class="text-sm">⏳ Memuat...</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. PENGATURAN SISTEM UTAMA
        // ==========================================
        // PASTIKAN MENGGUNAKAN LINK DEPLOY V4 BAPAK YANG TERBARU
        const URL_GAS = "https://script.google.com/macros/s/AKfycbxNNmH8GmlkJkBxzUkItWH1a5c1BbLWRAzy1fA4agwFiFJnCh8v1rgDfCNtbrzBUIfRAg/exec";
        const KANTOR_LAT = -2.479711; // Koordinat DPMPTSP Morowali
        const KANTOR_LNG = 121.937282;
        const MAX_RADIUS = 50; 

        let myLat = 0, myLng = 0;
        let jarakMeter = 999999;
        let isGpsReady = false;

        // ==========================================
        // 2. LOGIKA JAM DIGITAL & ATURAN TOMBOL 
        // ==========================================
        function updateClock() {
            const now = new Date();
            // Paksa Jam mengikuti Waktu WITA (GMT+8)
            const offset = 8;
            const localTime = now.getTime() + (now.getTimezoneOffset() * 60000);
            const wita = new Date(localTime + (3600000 * offset));

            const jam = String(wita.getHours()).padStart(2, '0');
            const menit = String(wita.getMinutes()).padStart(2, '0');
            const detik = String(wita.getSeconds()).padStart(2, '0');
            
            const hariArr = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const bulanArr = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            
            document.getElementById('clock').innerText = `${jam}:${menit}:${detik}`;
            document.getElementById('date').innerText = `${hariArr[wita.getDay()]}, ${wita.getDate()} ${bulanArr[wita.getMonth()]} ${wita.getFullYear()}`;

            aturTombolAbsen(jam, menit);
        }

        function aturTombolAbsen(jam, menit) {
            const jamSekarang = `${jam}:${menit}`;
            const btnDatang = document.getElementById('btnDatang');
            const btnPulang = document.getElementById('btnPulang');
            const btnTL = document.getElementById('btnTL');

            // Default: Tombol Datang dan Pulang Mati (Abu-abu)
            btnDatang.disabled = true;
            btnDatang.className = "bg-gray-100 text-gray-400 font-semibold py-4 rounded-xl flex flex-col items-center justify-center gap-1 border border-gray-200 cursor-not-allowed";
            btnDatang.innerHTML = `<span class="text-2xl opacity-50 grayscale"></span><span class="text-[10px] uppercase font-bold tracking-widest">Belum Waktu Masuk</span>`;

            btnPulang.disabled = true;
            btnPulang.className = "bg-gray-100 text-gray-400 font-semibold py-4 rounded-xl flex flex-col items-center justify-center gap-1 border border-gray-200 cursor-not-allowed";
            btnPulang.innerHTML = `<span class="text-2xl opacity-50 grayscale"></span><span class="text-[10px] uppercase font-bold tracking-widest">Belum Waktu Pulang</span>`;

            // Tombol Tugas Luar Selalu Aktif
            btnTL.disabled = false;
            btnTL.className = "w-full bg-slate-800 active:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition transform active:scale-95 flex items-center justify-center gap-2 mt-1 shadow-md";
            btnTL.innerHTML = `<span class="text-xl"></span><span class="text-xs tracking-widest">TUGAS LUAR / DINAS</span>`;

            // Aturan Absen Datang: 07:30 - 09:00 WITA
            if (jamSekarang >= "00:00" && jamSekarang <= "59") {
                btnDatang.disabled = false;
                btnDatang.className = "bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-[0_4px_15px_rgba(16,185,129,0.4)] transition transform active:scale-95 flex flex-col items-center justify-center gap-1 border border-emerald-400";
                btnDatang.innerHTML = `<span class="text-3xl drop-shadow-md"></span><span class="text-xs uppercase tracking-widest font-black">DATANG</span>`;
            }

            // Aturan Absen Pulang: 16:00 - 17:00 WITA
            if (jamSekarang >= "00:00" && jamSekarang <= "17:00") {
                btnPulang.disabled = false;
                btnPulang.className = "bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-4 rounded-xl shadow-[0_4px_15px_rgba(37,99,235,0.4)] transition transform active:scale-95 flex flex-col items-center justify-center gap-1 border border-blue-500";
                btnPulang.innerHTML = `<span class="text-3xl drop-shadow-md"></span><span class="text-xs uppercase tracking-widest font-black">PULANG</span>`;
            }
        }

        setInterval(updateClock, 1000);

        // ==========================================
        // 3. LOGIKA IDENTITAS & DROPDOWN PEGAWAI
        // ==========================================
        let dataMasterPegawai = [];

        window.onload = () => {
            updateClock();
            cekMemoriAtauMuat();
            mulaiGPS();
        };

        function cekMemoriAtauMuat() {
            let nip = localStorage.getItem("absen_nip");
            let nama = localStorage.getItem("absen_nama");
            
            if (nip && nama) {
                renderKartuPegawai(nama);
            } else {
                muatDaftarPegawai();
            }
        }

        function muatDaftarPegawai() {
            fetch(URL_GAS + "?action=get_pegawai")
            .then(res => res.json())
            .then(data => {
                dataMasterPegawai = data.filter(p => p.Status === "Aktif");
                renderDropdown();
            }).catch(err => {
                document.getElementById('areaIdentitas').innerHTML = `<p class="text-xs text-red-500 font-bold p-4 bg-red-50 rounded-xl border border-red-100 text-center">Gagal memuat nama. Periksa sinyal Anda.</p>`;
            });
        }

        function renderDropdown() {
            let html = `
                <div class="animate-fade-in border border-blue-100 rounded-xl shadow-sm">
                    <select id="pilihPegawai" class="w-full bg-white text-slate-800 text-sm font-bold rounded-xl px-4 py-3.5 outline-none focus:ring-2 focus:ring-blue-500 appearance-none">
                        <option value="">-- Sentuh untuk Memilih Nama --</option>
            `;
            dataMasterPegawai.forEach(p => { html += `<option value="${p.NIP_NIK}">${p.Nama_Lengkap}</option>`; });
            html += `</select></div>`;
            document.getElementById('areaIdentitas').innerHTML = html;
        }

        function renderKartuPegawai(nama) {
            document.getElementById('areaIdentitas').innerHTML = `
                <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 p-4 rounded-xl flex items-center gap-3 shadow-sm animate-fade-in">
                    <div class="bg-blue-600 w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-inner shrink-0">${nama.charAt(0).toUpperCase()}</div>
                    <div class="overflow-hidden">
                        <p class="text-[9px] text-blue-500 font-bold tracking-widest uppercase mb-0.5">Pegawai Aktif</p>
                        <h4 class="text-slate-800 font-black text-xs leading-tight truncate whitespace-nowrap">${nama}</h4>
                    </div>
                </div>
            `;
        }

        // Fitur Rahasia dari Desain Asli Bapak: Ketuk Logo 5x untuk Ganti Akun
        let ketukHitung = 0; let ketukTimer;
        function resetDevice() {
            ketukHitung++; clearTimeout(ketukTimer);
            if(ketukHitung >= 5) {
                localStorage.removeItem("absen_nip"); localStorage.removeItem("absen_nama");
                ketukHitung = 0;
                Swal.fire({icon: 'success', title: 'Perangkat Di-reset', text: 'Silakan pilih nama ulang.', timer: 2000, showConfirmButton: false});
                document.getElementById('areaIdentitas').innerHTML = `<div class="flex justify-center py-4"><div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-8 w-8"></div></div>`;
                muatDaftarPegawai();
            }
            ketukTimer = setTimeout(() => { ketukHitung = 0; }, 1000);
        }

        // ==========================================
        // 4. LOGIKA PELACAKAN LOKASI (GPS)
        // ==========================================
        function mulaiGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    pos => {
                        myLat = pos.coords.latitude;
                        myLng = pos.coords.longitude;
                        jarakMeter = Math.round(hitungJarak(KANTOR_LAT, KANTOR_LNG, myLat, myLng));
                        isGpsReady = true;
                        
                        const ikon = document.getElementById('ikonGps');
                        if (jarakMeter <= MAX_RADIUS) {
                            ikon.className = "bg-emerald-100 p-2.5 rounded-full text-emerald-600";
                            ikon.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                            document.getElementById('teksLokasiUtama').innerText = "Di Dalam Area Kantor";
                            document.getElementById('teksLokasiUtama').className = "text-emerald-700 font-bold text-sm";
                            document.getElementById('teksLokasiDetail').innerText = `Akurasi jarak: ${jarakMeter} meter.`;
                        } else {
                            ikon.className = "bg-rose-100 p-2.5 rounded-full text-rose-600";
                            ikon.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                            document.getElementById('teksLokasiUtama').innerText = "Di Luar Area Kantor";
                            document.getElementById('teksLokasiUtama').className = "text-rose-700 font-bold text-sm";
                            document.getElementById('teksLokasiDetail').innerText = `Jarak Anda: ${jarakMeter}m. Maksimal: ${MAX_RADIUS}m.`;
                        }
                    },
                    err => {
                        document.getElementById('teksLokasiUtama').innerText = "GPS Gagal Aktif";
                        document.getElementById('teksLokasiUtama').className = "text-amber-600 font-bold text-sm";
                        document.getElementById('teksLokasiDetail').innerText = "Mohon nyalakan izin lokasi (GPS).";
                        isGpsReady = false;
                    },
                    { enableHighAccuracy: true, maximumAge: 0 }
                );
            }
        }

        function hitungJarak(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        }

        // ==========================================
        // 5. PENGIRIMAN DATA (SISTEM V4 CODE.GS)
        // ==========================================
        function klikAbsen(aksi) {
            let nipKirim = localStorage.getItem("absen_nip");
            let namaKirim = localStorage.getItem("absen_nama");

            // Jika belum ada memori, tarik dari Dropdown
            if (!nipKirim) {
                const dropdown = document.getElementById('pilihPegawai');
                if (!dropdown || dropdown.value === "") {
                    Swal.fire('Identitas Kosong', 'Tunggu data dimuat atau pilih nama Anda terlebih dahulu!', 'warning');
                    return;
                }
                nipKirim = dropdown.value;
                namaKirim = dropdown.options[dropdown.selectedIndex].text;
            }

            // Validasi GPS
            if (!isGpsReady) {
                Swal.fire('Lokasi Belum Terbaca', 'Tunggu sebentar sampai tulisan "Mencari Koordinat" berubah menjadi jarak meter.', 'info');
                return;
            }
            if (aksi !== 'Tugas Luar' && jarakMeter > MAX_RADIUS) {
                Swal.fire({icon: 'error', title: 'Akses Ditolak', html: `Anda berada di luar kantor (${jarakMeter} meter).<br>Harus berada dalam radius ${MAX_RADIUS} meter.`});
                return;
            }

            Swal.fire({ title: 'Merekam Jejak...', text: 'Mengirim data ke server utama.', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

            const payload = {
                action: "absen_digital",
                nip: nipKirim,
                nama: namaKirim,
                aksi: aksi,
                koordinat: `${myLat}, ${myLng}`,
                statusJarak: aksi === "Tugas Luar" ? "Tugas Luar" : "Valid"
            };

            fetch(URL_GAS, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(resData => {
                if(resData.status === "success") {
                    localStorage.setItem("absen_nip", nipKirim);
                    localStorage.setItem("absen_nama", namaKirim);
                    cekMemoriAtauMuat(); // Tampilkan kartu nama yang elegan
                    Swal.fire('Berhasil!', resData.message, 'success');
                } else {
                    Swal.fire('Peringatan', resData.message, 'warning');
                }
            })
            .catch(() => {
                Swal.fire('Error', 'Gagal terhubung ke jaringan server.', 'error');
            });
        }
    </script>
</body>
</html>
